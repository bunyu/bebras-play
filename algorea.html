<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algoréa</title>
<script src="lang.js"></script>
<style>
   :root {
      --bg: #171b21; --card: #22272e; --ink: #e3e7ec; --soft: #9aa4af; --line: #39414b;
      --accent: #3d86d8; --star: #f2b01e; --star-off: #4a535e; --on: #e3e7ec; --on-ink: #171b21;
      --blanche: #c3cad2; --jaune: #f0c000; --orange: #f08a00; --vert: #3aa655; --autre: #8f84e6;
      color-scheme: dark;
   }
   * { box-sizing: border-box; }
   html, body { height: 100%; margin: 0; }
   body { font-family: "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 16px; }
   button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink);
            border-radius: 10px; padding: 10px 16px; min-height: 44px; }
   button:hover { border-color: var(--accent); }
   button.main { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
   button.on { background: var(--on); border-color: var(--on); color: var(--on-ink); }
   [hidden] { display: none !important; }

   /* ---------- home ---------- */
   #home { max-width: 1200px; margin: 0 auto; padding: 16px; }
   .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
   .top h1 { font-size: 24px; margin: 0; }
   .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0; }
   .chip { border-radius: 999px; padding: 8px 16px; }
   .chip i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
   #progress { display: flex; flex-wrap: wrap; gap: 12px; margin: 6px 0 4px; }
   .meter { flex: 1 1 180px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
   .meter b { display: block; font-size: 14px; margin-bottom: 6px; }
   .meter span { float: right; font-weight: 400; color: var(--soft); }
   .bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
   .bar div { height: 100%; }
   h2 { font-size: 19px; margin: 26px 0 4px; }
   h2 small { font-weight: 400; color: var(--soft); font-size: 14px; margin-left: 8px; }
   .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-top: 10px; }
   .card { text-align: left; padding: 12px 12px 12px 18px; border-radius: 12px; position: relative; min-height: 92px; overflow: hidden; }
   .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--c); }
   .card strong { display: block; font-size: 16px; line-height: 1.25; }
   .card em { display: block; font-style: normal; font-size: 13px; color: var(--soft); margin: 4px 0 8px; }
   .stars { letter-spacing: 2px; font-size: 20px; color: var(--star-off); white-space: nowrap; }
   .stars b { color: var(--star); font-weight: 400; }
   .card.done { background: #1f3327; }
   .mock { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 12px; }
   .mock button { text-align: left; border-left: 8px solid var(--c); }
   .mock em { display: block; font-style: normal; color: var(--soft); font-size: 13px; }
   input[type=number], input[type=text] { background: var(--bg); color: var(--ink); font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; min-height: 44px; }
   input[type=number] { width: 90px; }
   p.note { color: var(--soft); margin: 6px 0; }

   /* ---------- player ---------- */
   #player { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
   #playbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--card); }
   #playbar button { padding: 6px 12px; min-height: 40px; }
   #ptitle { font-weight: 600; margin: 0 6px; }
   #ptitle small { font-weight: 400; color: var(--soft); margin-left: 6px; }
   #clock { margin-left: auto; font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; padding: 2px 12px; border-radius: 8px; background: var(--bg); }
   #clock.late { background: #5a1f1f; color: #ffb4a8; }
   #mocktabs { display: flex; gap: 6px; flex-wrap: wrap; }
   #frames { flex: 1; position: relative; }
   #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; }
   #frames iframe.on { visibility: visible; }

   /* ---------- dialog ---------- */
   #veil { position: fixed; inset: 0; background: rgba(0, 0, 0, .65); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
   #box { background: var(--card); border-radius: 16px; padding: 22px; width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; }
   #box h3 { margin: 0 0 12px; font-size: 21px; }
   #box .row { margin: 12px 0 0; }
   #box table { width: 100%; border-collapse: collapse; margin-top: 6px; }
   #box td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
   #box td:last-child { text-align: right; }
   .ages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
   .ages button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; font-size: 15px; }
   .ages button span { font-size: 34px; line-height: 1.1; }
   #listen.on { background: var(--star); border-color: var(--star); color: var(--on-ink); }

   /* ---------- the youngest (5 to 7): bigger, fewer words ---------- */
   body.big { font-size: 20px; }
   body.big .cards { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
   body.big .card { min-height: 120px; padding: 16px 16px 16px 24px; border-radius: 18px; }
   body.big .card::before { width: 14px; }
   body.big .card strong { font-size: 22px; }
   body.big .card em, body.big #progress, body.big #views { display: none; }
   body.big .stars { font-size: 30px; }
   body.big #playbar button { min-height: 52px; font-size: 22px; padding: 6px 16px; }
   body.big #ptitle small { display: none; }
   /* on a phone the bar above a problem stays on one line: icons, and the title cut if too long */
   @media (max-width: 699px) {
      #playbar { flex-wrap: nowrap; gap: 4px; padding: 4px 6px; }
      #playbar button, body.big #playbar button { min-height: 40px; min-width: 36px; padding: 4px 6px; font-size: 17px; flex: none; }
      #playbar .word, #ptitle small { display: none; }
      #ptitle { flex: 1 1 auto; min-width: 0; margin: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 16px; }
      #pstars, body.big #pstars { flex: none; font-size: 15px; }
      #mocktabs { flex-wrap: nowrap; overflow-x: auto; min-width: 0; }
      #clock { font-size: 16px; padding: 2px 6px; }
   }
   /* a small phone: ◀ ▶ make room for the title (the list is one tap away with ←) */
   @media (max-width: 480px) { #playbar #prev, #playbar #next { display: none; } }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div id="home">
   <div class="top">
      <h1 data-t="home"></h1>
      <span><button id="lang"></button> <button id="received" data-t="received"></button> <button id="editor" data-t="mine"></button> <button id="trophies"></button> <button id="who"></button></span>
   </div>
   <div class="row" id="views">
      <button data-view="map" id="mapview"></button>
      <button data-view="tour" data-t="byRound"></button>
      <button data-view="skill" data-t="bySkill"></button>
      <button data-view="mock" data-t="mockView"></button>
   </div>
   <div class="row" id="colors"></div>
   <div id="progress"></div>
   <div id="list"></div>
</div>

<div id="player" hidden>
   <div id="playbar">
      <button id="back" data-t="back"></button>
      <button id="prev" data-title="prev">◀</button>
      <button id="next" data-title="next">▶</button>
      <button id="listen" data-title="listen">🔊</button>
      <button id="guide" data-title="guideTip">🎓</button>
      <button id="hint" data-title="hintTip">💡</button>
      <button id="errors" data-title="errorsTip" hidden>⚠️</button>
      <span id="ptitle"></span>
      <span class="stars" id="pstars"></span>
      <span id="mocktabs"></span>
      <button id="solution" data-t="solutionBtn" hidden></button>
      <span id="clock" hidden></span>
      <button id="finish" class="main" data-t="finish" hidden></button>
   </div>
   <div id="frames"></div>
</div>

<div id="veil" hidden><div id="box"></div></div>

         ok: 'Đồng ý', cancel: 'Hủy', noTasks: 'Không tìm thấy bài nào. Hãy chạy update.bat để tạo danh sách (tasks.js).',
         mockTitle: 'Thi thử', mockAbout: 'Giống như ngày thi: tất cả các bài của một vòng, có đồng hồ đếm giờ.',
         minutes: 'Thời gian (phút):', problems: '{n} bài', timeUp: 'Hết giờ!', roundDone: 'Đã xong vòng thi',

   });
   function f(key, args) { return L.fmt(T[key], args || {}); }
   // the task's title in this language (i18n/tasks-<lang>.js), French when it has none yet
   var TEXTS = window.ALGOREA_TASK_TEXT || {};
   TUTORIALS.forEach(function (t) { t.groupName = T.learn; });
   TASKS.forEach(function (t) {
      if (TEXTS[t.id] && TEXTS[t.id].title) { t.title = TEXTS[t.id].title; }
      if (t.group) {
         t.groupName = t.group === 'Mes problèmes' ? T.myProblems : t.group.replace(/^Préparation/, T.practice);
      }
   });
   Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = T[el.dataset.t]; });
   Array.prototype.forEach.call(document.querySelectorAll('[data-title]'), function (el) { el.title = T[el.dataset.title]; });
   document.title = T.home;
   // the words of these two buttons are left out on a phone (see #playbar .word)
   $('back').innerHTML = '← <span class="word">' + esc(T.back.replace(/^←\s*/, '')) + '</span>';
   $('solution').innerHTML = '🔑<span class="word"> ' + esc(T.solutionBtn) + '</span>';
   $('solution').title = T.solutionBtn;

   var COLORS = ['blanche', 'jaune', 'orange', 'vert'];
   var COLOR_NAMES = T.colors;
   var SKILLS = ['sequences', 'boucles', 'conditions', 'variables', 'fonctions', 'listes'];
   var SKILL_NAMES = T.skills;
   var LEVEL_NAMES = { basic: f('version', { n: 1 }), easy: f('version', { n: 2 }), medium: f('version', { n: 3 }), hard: f('version', { n: 4 }) };
   // what a new child sees first, by age; the colours can still be changed on the home page
   var AGES = {
      petit: { icon: '🐣', name: T.ages[0], colors: ['blanche'], view: 'map', big: true },
      moyen: { icon: '🦊', name: T.ages[1], colors: ['blanche', 'jaune'], view: 'map' },
      grand: { icon: '🚀', name: T.ages[2], colors: [], view: 'tour' }
   };
   // the three languages; a change reloads the page so that the problems open in the new one
   function langButtons() {
      var row = document.createElement('div');
      row.className = 'ages';
      Object.keys(L.LANGS).forEach(function (l) {
         var b = document.createElement('button');
         b.innerHTML = '<span>' + L.FLAGS[l] + '</span>' + esc(L.LANGS[l]);
         if (l === L.lang) { b.className = 'on'; }
         b.onclick = function () {
            if (l === L.lang) { closeDialog(); return; }
            L.set(l);
            location.reload();
         };
         row.appendChild(b);
      });
      return row;
   }
   function chooseLanguage() {
      var box = dialog('<h3>🌐 ' + esc(T.language) + '</h3><div id="langs"></div><div class="row"><button id="close">' + esc(T.close) + '</button></div>');
      box.querySelector('#langs').appendChild(langButtons());
      box.querySelector('#close').onclick = closeDialog;
   }
   function ageButtons(chosen, then) {
      var row = document.createElement('div');
      row.className = 'ages';
      Object.keys(AGES).forEach(function (age) {
         var b = document.createElement('button');
         b.innerHTML = '<span>' + AGES[age].icon + '</span>' + esc(AGES[age].name);
         if (age === chosen) { b.className = 'on'; }
         b.onclick = function () { then(age); };
         row.appendChild(b);
      });
      return row;
   }
   var MAX_FRAMES = 8;

   function $(id) { return document.getElementById(id); }
   function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
   function colorOf(t) { return t.color || 'autre'; }
   function roundName(t) { return t.year ? f('round', { year: t.year, tour: t.tour }) : (t.groupName || t.group); }
   function where(t) { return roundName(t) + ' · ' + f('number', { n: t.number }); }

   /* ---------- saved data: one entry per child, kept in this browser ---------- */
   var KEY = 'algoreaTrainer.v1';
   var store = { current: null, profiles: {} };
   try { store = JSON.parse(localStorage.getItem(KEY)) || store; } catch (e) { /* first visit or storage off */ }
   function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* storage full or off */ } }

         var old = frameOrder.shift();

         return (intro ? intro.innerText : '').replace(/\s+\n/g, '\n').trim();
      } catch (e) { return ''; }
   }
   function listen() {
      if (speaking) { stopSpeaking(); return; }
      var text = statement(playing.id);
      if (!text) { return; }
      speaking = true;
      $('listen').className = 'on';
      if (window.AndroidBridge && AndroidBridge.speak) {
         if (AndroidBridge.speakIn) { AndroidBridge.speakIn(text, L.lang); } else { AndroidBridge.speak(text); }
         return;
      }
      if (!window.speechSynthesis) { speaking = false; $('listen').className = ''; return; }
      var u = new SpeechSynthesisUtterance(text);

      if (after > before) {
         Rea.sound('win'); Rea.buzz(60); Rea.confetti();
         for (var i = before; i < after; i++) { setTimeout(function () { Rea.sound('star'); Rea.flyStar(null, $('pstars')); }, 500 + (i - before) * 300); }
      } else {
         Rea.sound('star');
      }
      var text = after >= total && after > before ? Rea.line('allStars') :
         n >= 3 ? Rea.line('winTries', { n: n + 1 }) :
         blocks && blocks <= 4 && Math.random() < 0.5 ? Rea.line('winFew', { n: blocks }) :
         Rea.line('win', { name: esc(store.current || '') });
      if (after < total && after > before) { text += '<br>' + Rea.line('next'); }
      reaSay(text, 'happy', 7000);
   }

   /* ---------- the step-by-step guide of the task page (tutorial.js) ---------- */
   // 💡: a hint in 3 steps, shown by the task page (tutorial.js) from the checked solutions
   function askHint() {
      var f = frames[playing.id];
      $('hint').classList.remove('glow');
      if (f) { f.contentWindow.postMessage({ source: 'algorea-trainer', type: 'hint', solutions: SOLUTIONS[playing.id] || {}, speak: me().age === 'petit' }, '*'); }
   }
   function startGuide(target) {
      stopSpeaking();
      target = target || (frames[playing.id] && frames[playing.id].contentWindow);
      if (target) { target.postMessage({ source: 'algorea-trainer', type: 'tutorial', speak: me().age === 'petit' }, '*'); }
   }

   function step(d) {
      var i = playing.ids.indexOf(playing.id) + d;
      if (i >= 0 && i < playing.ids.length) { show(playing.ids[i]); }
   }

   function tick() {
      var left = Math.max(0, playing.mock.end - Date.now());
      var m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
      $('clock').textContent = m + ':' + (s < 10 ? '0' : '') + s;
      $('clock').className = left < 5 * 60000 ? 'late' : '';
      if (!left) { finishMock(true); }
   }

   function finishMock(timeUp) {
      clearInterval(ticker);
      var mock = playing.mock, got = 0, total = 0, rows = '';
      playing.ids.forEach(function (id, i) {
         var t = BY_ID[id], n = mock.got[id] || 0;
         got += n; total += t.levels.length;
         rows += '<tr><td>' + (i + 1) + '. ' + esc(t.title) + '</td><td><span class="stars">' + starsHtml(n, t.levels.length) + '</span></td></tr>';
      });
      var box = dialog('<h3>' + esc(timeUp ? T.timeUp : T.roundDone) + '</h3><p>' + esc(mock.title) + '</p>' +
         '<table>' + rows + '<tr><td><b>' + esc(T.total) + '</b></td><td><b>' + got + ' / ' + total + ' ★</b></td></tr></table>' +
         '<div class="row"><button id="ok" class="main">' + esc(T.toHome) + '</button></div>');
      box.querySelector('#ok').onclick = function () { closeDialog(); goHome(); };
   }

   function goHome() {
      stopSpeaking();
      clearInterval(ticker);
      if (playing && playing.mock) { dropFrames(); }
      playing = null;
      $('player').hidden = true;
      $('home').hidden = false;
      render();
   }

   function chooseSolution() {
      var id = playing.id, t = BY_ID[id], sol = SOLUTIONS[id];
      var box = dialog('<h3>' + esc(f('solutionOf', { title: t.title })) + '</h3><p>' + esc(T.solutionAbout) + '</p><div class="row" id="lv"></div>' +
         '<div class="row"><button id="no">' + esc(T.cancel) + '</button></div>');
      box.querySelector('#no').onclick = closeDialog;
      t.levels.forEach(function (level) {
         if (!sol[level]) { return; }
         var b = document.createElement('button');
         b.textContent = LEVEL_NAMES[level];
         b.onclick = function () {
            frames[id].contentWindow.postMessage({ source: 'algorea-trainer', type: 'loadProgram', level: level, xml: sol[level] }, '*');
            closeDialog();
         };
         box.querySelector('#lv').appendChild(b);
      });
   }

   /* ---------- messages from the task pages (bridge.js) ---------- */
   window.addEventListener('message', function (event) {
      var msg = event.data;
      if (!msg || msg.source !== 'algorea-task') { return; }
      var id = Object.keys(frames).filter(function (x) { return frames[x].contentWindow === event.source; })[0];
      if (!id) { return; }
      var t = BY_ID[id], mock = playing && playing.mock;

      if (msg.type === 'ready') {
         event.source.postMessage({ source: 'algorea-trainer', type: 'config', gentle: isYoung(), bigBlocks: me().age === 'petit' }, '*');
         // outside a mock round, put back the programs of the last visit
         if (!mock && me().answers[id] && !t.tutorial) {
            event.source.postMessage({ source: 'algorea-trainer', type: 'restore', answer: me().answers[id] }, '*');
         } else if (!starsOf(id) && t.levels.length) {
            event.source.postMessage({ source: 'algorea-trainer', type: 'setLevel', level: t.levels[0] }, '*');
         }
         // the guide: always in "Learn to play", and the first time a young child meets a world
         var p = store.profiles[store.current], world = msg.world;
         if (world && world !== 'none') { worldOf[id] = world; }
         var young = p && (p.age === 'petit' || p.age === 'moyen');
         if (t.tutorial || (!mock && young && world && world !== 'none' && !(p.tutorials || {})[world])) {
            if (p && world && world !== 'none') { (p.tutorials = p.tutorials || {})[world] = true; save(); }
            var target = event.source;
            setTimeout(function () { if (playing && playing.id === id) { startGuide(target); } }, 1200);
         }
         return;
      }
      if (msg.type === 'hintUsed') {
         if (store.profiles[store.current]) {
            var used = me().hints = me().hints || {};
            used[id] = Math.max(used[id] || 0, msg.step); save();
         }
         return;
      }
      if (msg.type === 'snap') { Rea.sound('snap'); Rea.buzz(15); return; }
      if (msg.type === 'runFailed') { if (playing && playing.id === id && !mock) { onRunFailed(id, msg.message); } return; }
      if (msg.type === 'score') {
         var n = countStars(t, msg.score, msg.maxScores), had = mock ? (mock.got[id] || 0) : starsOf(id);
         if (msg.score > 0 && playing && playing.id === id && !mock) { onSolved(id, had, Math.max(had, n), t.levels.length, msg.blocks); }
         if (mock) { mock.got[id] = Math.max(mock.got[id] || 0, n); }
         if (store.profiles[store.current]) {
            if (n > starsOf(id)) {
               questProgress(t, starsOf(id), n); me().stars[id] = n;
               var w = t.tutorial || worldOf[id];
               if (w && STICKERS[w]) { (me().stickers = me().stickers || {})[w] = true; }
               if (!mock) { checkRewards(false); }
            }
            if (!mock && msg.answer) { me().answers[id] = msg.answer; }
            save();
         }
         refreshBar();
      }
   });

   /* ---------- buttons ---------- */
   $('who').onclick = chooseProfile;
   $('trophies').onclick = showShelf;
   $('lang').onclick = chooseLanguage;
   $('editor').onclick = function () { location.href = 'editeur.html'; };
   $('received').onclick = function () { location.href = 'partage.html'; };
   $('listen').onclick = listen;
   $('guide').onclick = function () { startGuide(); };
   $('hint').onclick = askHint;
   // in the Android application: the errors met by the pages, to help find what does not work
   window.appErrorsChanged = function () { $('errors').hidden = false; };
   $('errors').onclick = function () {
      var box = dialog('<h3>' + esc(T.errorsTitle) + '</h3><p class="note">' + esc(T.errorsAbout) + '</p>' +
         '<pre style="white-space:pre-wrap;font-size:12px;max-height:50vh;overflow:auto"></pre>' +
         '<div class="row"><button id="close">' + esc(T.close) + '</button></div>');
      box.querySelector('pre').textContent = navigator.userAgent + '\n\n' +
         (window.AndroidBridge && AndroidBridge.errors ? AndroidBridge.errors() : '');
      box.querySelector('#close').onclick = closeDialog;
   };
   // the Android back button: closes a dialog, then the problem; false lets the application decide
   window.appBack = function () {
      if (!$('veil').hidden) {
         // the dialog's own way out: "Fermer" / "Annuler", or "Retour à l'accueil" after a mock round
         var out = $('box').querySelector('#close') || $('box').querySelector('#no') || $('box').querySelector('#ok');
         if (out) { out.onclick(); }
         return true;
      }
      if (!$('player').hidden) { $('back').onclick(); return true; }
      return false;
   };
   $('views').onclick = function (e) {
      if (e.target.dataset.view) { me().view = e.target.dataset.view; save(); render(); }
   };
   $('back').onclick = function () {
      if (playing.mock) { finishMock(false); } else { goHome(); }
   };
   $('finish').onclick = function () { finishMock(false); };
   $('prev').onclick = function () { step(-1); };
   $('next').onclick = function () { step(1); };
   $('solution').onclick = function () { askParent(chooseSolution); };

   render();
})();
</script>
</body>
</html>
